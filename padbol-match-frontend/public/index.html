<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/brand/padbol-match-icon.svg?v=20260723" />
    <link rel="alternate icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico?v=20260723" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var refreshId = params.get('qa_refresh');
        if (!refreshId) return;
        var guardKey = 'padbol:qa-refresh:' + refreshId;
        if (sessionStorage.getItem(guardKey) === 'done') return;
        sessionStorage.setItem(guardKey, 'done');
        var unregister = !('serviceWorker' in navigator)
          ? Promise.resolve()
          : navigator.serviceWorker.getRegistrations().then(function (registrations) {
              return Promise.all(registrations.map(function (registration) {
                return registration.unregister();
              }));
            });
        var clearCaches = !('caches' in window)
          ? Promise.resolve()
          : caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) { return caches.delete(key); }));
            });
        Promise.all([unregister, clearCaches]).finally(function () {
          params.delete('qa_refresh');
          params.set('qa_build', refreshId);
          var next = window.location.pathname + '?' + params.toString() + window.location.hash;
          window.location.replace(next);
        });
      })();
    </script>
    <script>
      if (new URLSearchParams(window.location.search).get('password_reset') === '1') {
        window.location.replace(
          'https://padbol-match-frontend.vercel.app/?password_reset=1' + window.location.hash
        );
      }
    </script>
    <script src="%PUBLIC_URL%/theme-init.js"></script>
    <meta name="application-name" content="Padbol Match" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Padbol Match" />
    <meta
      name="description"
      content="La plataforma oficial de PADBOL para reservas, torneos y rankings"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/brand/padbol-match-apple-touch-icon.png?v=20260723" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>PADBOL Match</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      (function () {
        var build = new URLSearchParams(window.location.search).get('qa_build');
        if (!build) return;
        var badge = document.createElement('div');
        badge.id = 'qa-build-marker';
        badge.textContent = 'QA ACTUALIZADO · ' + build;
        badge.setAttribute('aria-label', 'Versión QA actualizada ' + build);
        badge.style.cssText = 'position:fixed;right:8px;bottom:8px;z-index:2147483647;padding:5px 8px;border-radius:6px;background:#111827;color:#fff;font:700 10px/1.2 Arial,sans-serif;letter-spacing:.04em;box-shadow:0 2px 8px rgba(0,0,0,.3)';
        document.body.appendChild(badge);
      })();
    </script>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
