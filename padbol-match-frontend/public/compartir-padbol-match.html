<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compartir Padbol Match</title><style>body{margin:0;background:#080809;color:#fff;font:17px system-ui;text-align:center;padding:36px 22px}main{max-width:440px;margin:auto}img{width:240px;max-width:90%;margin:16px auto 28px}h1{font-size:28px}p{color:#d2cbd0;line-height:1.5}button,a{display:block;box-sizing:border-box;width:100%;padding:16px;margin:14px 0;border-radius:16px;border:1px solid #d6b659;background:#e7cb75;color:#100e09;text-decoration:none;font:700 17px system-ui}a{background:#171319;color:white}#status{min-height:24px}</style><main><img src="/media/public-site/jero/padbol-match-logo-white.svg" alt="Padbol Match"><h1>Seguí la Nations Cup en vivo</h1><p>Partidos y resultados en tu teléfono.<br>Compartí Padbol Match con quienes siguen el torneo.</p><button id="share">Compartir app ↗</button><a href="https://apps.apple.com/app/id6814243035">Descargar en App Store</a><a href="https://play.google.com/store/apps/details?id=com.padbolmatch.app">Descargar en Google Play</a><p id="status" role="status"></p></main><script>const url='https://www.padbolmatch.com/compartir-padbol-match.html';document.getElementById('share').onclick=async()=>{const status=document.getElementById('status');try{if(navigator.share){await navigator.share({title:'Padbol Match',text:'Seguí la Nations Cup y los resultados en vivo en Padbol Match.',url});}else if(navigator.clipboard){await navigator.clipboard.writeText(url);status.textContent='Enlace copiado. Pegalo en WhatsApp o donde quieras compartirlo.';}else{status.textContent=url;}}catch(e){if(e.name!=='AbortError')status.textContent='Podés compartir este enlace: '+url;}};</script></html>
